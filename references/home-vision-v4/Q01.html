<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const p = (this.state && this.state.picked) || 0;
    const v = {};
    for (let i = 1; i <= 5; i++) {
      v['c' + i] = p === i ? 'on' : '';
      v['a' + i] = p === i ? 'true' : 'false';
      v['sel' + i] = p === i;
      v['p' + i] = () => this.setState({ picked: i });
    }
    v.noSel = p === 0;
    v.ctaClass = p === 0 ? 'off' : '';
    v.skip = () => this.setState({ picked: 0 });
    return v;
  }
}
