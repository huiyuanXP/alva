class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const kidsOn = this.props.hasChildren ?? true;
    const babyOn = this.props.babyOrToddler ?? false;
    const labels = {"entry": "Entryway", "living": "Living room", "kitchen": "Kitchen", "dining": "Dining area", "bedroom": "Bedrooms", "bathroom": "Bathrooms", "office": "Home office", "laundry": "Laundry / utility", "guest": "Guest room", "outdoor": "Balcony / yard", "kids": "Kids' room", "nursery": "Nursery"};
    const keys = Object.keys(labels).filter(k => (k !== 'kids' || kidsOn) && (k !== 'nursery' || babyOn));
    const sel = st.sel || {};
    const whole = !!st.whole;
    const v = {};
    keys.forEach(k => {
      const on = !whole && !!sel[k];
      v['c_' + k] = on ? 'on' : '';
      v['a_' + k] = on ? 'true' : 'false';
      v['s_' + k] = on;
      v['p_' + k] = () => {
        const next = Object.assign({}, sel);
        next[k] = !next[k];
        const pr = next[st.priority] ? st.priority : null;
        this.setState({ sel: next, whole: false, priority: pr });
      };
    });
    v.show_kids = kidsOn;
    v.show_nursery = babyOn;
    v.c_whole = whole ? 'on' : '';
    v.a_whole = whole ? 'true' : 'false';
    v.s_whole = whole;
    v.p_whole = () => this.setState({ whole: !whole, sel: {}, priority: null });
    const chosen = whole ? keys : keys.filter(k => sel[k]);
    v.showPriority = whole || chosen.length >= 2;
    v.chips = chosen.map(k => ({ label: labels[k], cls: st.priority === k ? 'on' : '', pick: () => this.setState({ priority: k }) }));
    v.noSel = !whole && chosen.length === 0;
    v.ctaClass = v.noSel ? 'off' : '';
    v.countText = whole ? 'Whole home selected' : (chosen.length === 0 ? 'You can change this anytime.' : chosen.length + (chosen.length === 1 ? ' space selected' : ' spaces selected'));
    v.clear = () => this.setState({ sel: {}, whole: false, priority: null });
    return v;
  }
}
</script>
